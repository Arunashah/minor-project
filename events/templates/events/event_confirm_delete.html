
<!DOCTYPE html>
<html>
<head>
    <title>Delete Event</title>
</head>
<body>

    <h1>Delete Event</h1>

    <p>
        Are you sure you want to delete
        "{{ event.title }}"?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">Yes, Delete</button>
    </form>

    <a href="{% url 'event_list' %}">Cancel</a>

</body>
</html>
